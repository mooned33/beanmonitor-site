name: SEO V2 bootstrap

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/seo-v2-bootstrap.yml"

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build SEO V2 pages
        run: node scripts/build-market-pages.mjs
      - name: Verify SEO V2 pages
        run: node scripts/verify-market-pages.mjs
      - name: Commit generated pages
        run: |
          git config user.name "beanmonitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html coffee-prices coffee-weather cup-of-excellence coffee-market-brief methodology sitemap.xml
          git commit -m "Bootstrap SEO V2 generated pages" || echo "generated pages already current"
          git push
